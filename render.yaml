services:
  - type: web
    name: bricole-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bricole-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: ADMIN_EMAIL
        value: admin@bricole.dz
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: bricole-db
    plan: free
