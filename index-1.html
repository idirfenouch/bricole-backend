<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRICOLE — Trouvez le bon professionnel</title>
    <meta name="description"
        content="BRICOLE met en relation particuliers et professionnels du bâtiment : plomberie, électricité, peinture, rénovation et plus." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .font-display {
            font-family: 'Poppins', sans-serif;
        }

        .step-progress {
            transition: width .3s ease;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-white text-slate-700">

    <div id="app"></div>

    <script>
        /* =========================================================================
           CONFIGURATION — à modifier avant publication
           ========================================================================= */
        const API_BASE = "https://REMPLACEZ-MOI-PAR-VOTRE-BACKEND.onrender.com/api";
        // Exemple une fois déployé sur Render : "https://bricole-backend.onrender.com/api"

        /* =========================================================================
           État de l'application
           ========================================================================= */
        let state = {
            view: "home",
            menuOpen: false,
            authType: "particulier",
            authError: "",
            authLoading: false,

            token: localStorage.getItem("bricole_token") || null,
            user: null,          // rempli via /auth/me au démarrage si un token existe
            sessionChecked: false,

            categories: [],

            selectedProId: null,
            selectedRequestId: null,
            selectedConversationId: null,

            wizardStep: 1,
            wizardData: { besoin: "", categoryId: null, categoryName: "", description: "", photos: 0, ville: "", codePostal: "", budget: "", urgence: "", disponibilite: "" },
            wizardSubmitting: false,
            wizardError: "",

            reviewDraft: { qualite: 0, ponctualite: 0, prix: 0, communication: 0, professionnalisme: 0, commentaire: "" },

            // caches de données chargées depuis l'API, avec indicateurs de chargement/erreur par domaine
            loading: {},
            errors: {},
            myRequests: [],
            feed: [],
            professionals: [],
            professionalDetail: null,
            requestDetail: null,
            requestProposals: [],
            requestQuotes: [],
            conversations: [],
            messages: [],
            appointments: [],
            notifications: [],
            adminStats: null,
            adminUsers: [],
            searchMetier: "Tous les métiers",
            quoteForm: { requestId: null, description: "", mainOeuvre: "", materiaux: "", frais: "", dureeEstimee: "", dateProposee: "" }
        };

        /* =========================================================================
           Client API
           ========================================================================= */
        async function apiFetch(path, { method = "GET", body, auth = true } = {}) {
            const headers = { "Content-Type": "application/json" };
            if (auth && state.token) headers.Authorization = `Bearer ${state.token}`;

            let response;
            try {
                response = await fetch(`${API_BASE}${path}`, {
                    method,
                    headers,
                    body: body ? JSON.stringify(body) : undefined,
                });
            } catch (networkErr) {
                throw new Error("Impossible de joindre le serveur. Vérifiez votre connexion ou l'URL du backend (API_BASE).");
            }

            let data = {};
            try { data = await response.json(); } catch (_) { /* réponse vide (ex: 204) */ }

            if (!response.ok) {
                throw new Error(data.error || `Erreur ${response.status}`);
            }
            return data;
        }

        function saveSession(token, user) {
            state.token = token;
            state.user = user;
            localStorage.setItem("bricole_token", token);
        }
        function clearSession() {
            state.token = null;
            state.user = null;
            localStorage.removeItem("bricole_token");
        }

        /* =========================================================================
           Navigation / rendu
           ========================================================================= */
        function setView(v) { state.view = v; window.scrollTo(0, 0); render(); }
        function toggleMenu() { state.menuOpen = !state.menuOpen; render(); }
        function icon(name, cls) { return `<i data-lucide="${name}" class="${cls || ''}"></i>`; }
        function stars(note) {
            let s = "";
            for (let i = 1; i <= 5; i++) {
                s += `<i data-lucide="star" class="w-3.5 h-3.5 ${i <= Math.round(note || 0) ? 'fill-orange-400 text-orange-400' : 'fill-slate-200 text-slate-200'}"></i>`;
            }
            return `<div class="flex items-center gap-0.5">${s}</div>`;
        }
        function initialsOf(name) { return (name || "?").split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase(); }
        function spinner() { return `<div class="flex justify-center py-16">${icon('loader-2', 'w-6 h-6 text-slate-300 spin')}</div>`; }
        function errorBox(msg) { return `<div class="bg-red-50 border border-red-100 text-red-600 text-sm rounded-lg p-4">${msg}</div>`; }
        function fmtDate(d) { return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long" }); }
        function fmtDateTime(d) { return new Date(d).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

        const STATUS_LABELS = {
            brouillon: "Brouillon", publiee: "Publiée", interesses: "Professionnels intéressés",
            devis_recus: "Devis reçus", pro_selectionne: "Professionnel sélectionné",
            en_cours: "Travaux en cours", terminee: "Terminée", annulee: "Annulée"
        };
        const STATUS_STYLES = {
            brouillon: "bg-slate-100 text-slate-600", publiee: "bg-blue-100 text-blue-800",
            interesses: "bg-orange-100 text-orange-700", devis_recus: "bg-purple-100 text-purple-700",
            pro_selectionne: "bg-teal-100 text-teal-700", en_cours: "bg-teal-100 text-teal-700",
            terminee: "bg-green-100 text-green-700", annulee: "bg-red-100 text-red-700"
        };

        const BESOINS = ["Réparer un problème", "Rénover", "Installer", "Entretenir", "Construire", "Bricoler", "Autre"];
        const URGENCES = ["Pas urgent", "Cette semaine", "Dès que possible", "Urgent"];
        const BUDGETS = ["Je ne sais pas", "Moins de 5 000 DA", "Entre 5 000 et 20 000 DA", "Plus de 20 000 DA"];

        /* =========================================================================
           Démarrage : restaurer la session + charger les catégories
           ========================================================================= */
        async function init() {
            try {
                const { categories } = await apiFetch("/categories", { auth: false });
                state.categories = categories;
            } catch (e) { state.errors.categories = e.message; }

            if (state.token) {
                try {
                    const { user } = await apiFetch("/auth/me");
                    state.user = user;
                } catch (e) {
                    clearSession(); // token invalide/expiré
                }
            }
            state.sessionChecked = true;
            render();
        }

        /* =========================================================================
           Authentification
           ========================================================================= */
        function setAuthType(t) { state.authType = t; render(); }

        async function doLogin(email, password) {
            state.authError = ""; state.authLoading = true; render();
            try {
                const { token, user } = await apiFetch("/auth/login", { method: "POST", auth: false, body: { email, password } });
                saveSession(token, user);
                state.authLoading = false;
                goToDashboard();
            } catch (e) {
                state.authError = e.message; state.authLoading = false; render();
            }
        }

        async function doRegister(fields) {
            state.authError = ""; state.authLoading = true; render();
            try {
                const { token, user } = await apiFetch("/auth/register", {
                    method: "POST", auth: false, body: {
                        fullName: fields.fullName, email: fields.email, password: fields.password,
                        role: state.authType, phone: fields.phone
                    }
                });
                saveSession(token, user);
                state.authLoading = false;
                goToDashboard();
            } catch (e) {
                state.authError = e.message; state.authLoading = false; render();
            }
        }

        function logout() { clearSession(); setView("home"); }

        function goToDashboard() {
            setView("dashboard");
            if (state.user.role === "particulier") loadMyRequests();
            else if (state.user.role === "pro") loadFeed();
            loadNotifications();
        }

        function requireLogin(role) {
            if (!state.user) { setView("login"); return false; }
            if (role && state.user.role !== role) { setView("dashboard"); return false; }
            return true;
        }

        /* =========================================================================
           Chargement des données (par domaine)
           ========================================================================= */
        async function loadMyRequests() {
            state.loading.myRequests = true; render();
            try { state.myRequests = (await apiFetch("/requests/mine")).requests; }
            catch (e) { state.errors.myRequests = e.message; }
            state.loading.myRequests = false; render();
        }

        async function loadFeed() {
            state.loading.feed = true; render();
            try { state.feed = (await apiFetch("/requests/feed")).requests; }
            catch (e) { state.errors.feed = e.message; }
            state.loading.feed = false; render();
        }

        async function loadProfessionals() {
            state.loading.professionals = true; render();
            try {
                const params = new URLSearchParams();
                if (state.searchMetier !== "Tous les métiers") params.set("category", state.searchMetier);
                state.professionals = (await apiFetch(`/professionals?${params.toString()}`, { auth: false })).professionals;
            } catch (e) { state.errors.professionals = e.message; }
            state.loading.professionals = false; render();
        }
        function setSearchMetier(m) { state.searchMetier = m; loadProfessionals(); }

        async function loadProfessionalDetail(id) {
            state.selectedProId = id; state.professionalDetail = null;
            state.loading.professionalDetail = true; render();
            try { state.professionalDetail = await apiFetch(`/professionals/${id}`, { auth: false }); }
            catch (e) { state.errors.professionalDetail = e.message; }
            state.loading.professionalDetail = false; render();
        }

        async function loadRequestDetail(id) {
            state.selectedRequestId = id;
            state.loading.requestDetail = true; render();
            try {
                state.requestDetail = await apiFetch(`/requests/${id}`);
                state.requestProposals = (await apiFetch(`/requests/${id}/proposals`)).proposals;
                state.requestQuotes = (await apiFetch(`/requests/${id}/quotes`)).quotes;
            } catch (e) { state.errors.requestDetail = e.message; }
            state.loading.requestDetail = false; render();
        }

        async function loadConversations() {
            state.loading.conversations = true; render();
            try { state.conversations = (await apiFetch("/conversations")).conversations; }
            catch (e) { state.errors.conversations = e.message; }
            state.loading.conversations = false; render();
        }

        async function loadMessages(conversationId) {
            state.selectedConversationId = conversationId;
            state.loading.messages = true; render();
            try { state.messages = (await apiFetch(`/conversations/${conversationId}/messages`)).messages; }
            catch (e) { state.errors.messages = e.message; }
            state.loading.messages = false; render();
        }

        async function loadAppointments() {
            state.loading.appointments = true; render();
            try { state.appointments = (await apiFetch("/appointments")).appointments; }
            catch (e) { state.errors.appointments = e.message; }
            state.loading.appointments = false; render();
        }

        async function loadNotifications() {
            try { state.notifications = (await apiFetch("/notifications")).notifications; render(); }
            catch (e) { /* silencieux : ne bloque pas le reste de l'UI */ }
        }

        async function loadAdmin() {
            state.loading.admin = true; render();
            try {
                state.adminStats = await apiFetch("/admin/stats");
                state.adminUsers = (await apiFetch("/admin/users")).users;
            } catch (e) { state.errors.admin = e.message; }
            state.loading.admin = false; render();
        }

        /* =========================================================================
           Actions
           ========================================================================= */
        async function exprimerInteret(requestId) {
            try {
                await apiFetch(`/requests/${requestId}/proposals`, { method: "POST", body: { message: "Je suis disponible pour ce chantier." } });
                loadFeed();
            } catch (e) { alert(e.message); }
        }

        async function decideQuote(quoteId, decision) {
            try {
                await apiFetch(`/quotes/${quoteId}/decision`, { method: "PATCH", body: { decision } });
                loadRequestDetail(state.selectedRequestId);
            } catch (e) { alert(e.message); }
        }

        async function markRequestComplete(requestId) {
            try {
                await apiFetch(`/requests/${requestId}/complete`, { method: "PATCH" });
                loadRequestDetail(requestId);
            } catch (e) { alert(e.message); }
        }

        async function sendMessage() {
            const input = document.getElementById("msgInput");
            if (!input || !input.value.trim()) return;
            try {
                await apiFetch(`/conversations/${state.selectedConversationId}/messages`, { method: "POST", body: { content: input.value } });
                input.value = "";
                loadMessages(state.selectedConversationId);
            } catch (e) { alert(e.message); }
        }

        async function openConversationForProposal(requestId, professionalId) {
            try {
                const { conversations } = await apiFetch("/conversations");
                const conv = conversations.find(c => c.request_id === requestId && c.professional_id === professionalId);
                if (!conv) { alert("Conversation introuvable."); return; }
                setView("messaging");
                loadMessages(conv.id);
            } catch (e) { alert(e.message); }
        }

        function openQuoteForm(requestId) {
            state.quoteForm = { requestId, description: "", mainOeuvre: "", materiaux: "", frais: "", dureeEstimee: "", dateProposee: "" };
            setView("quoteForm");
        }
        async function submitQuote() {
            const q = state.quoteForm;
            if (!q.description || !q.mainOeuvre || !q.materiaux) { alert("Veuillez remplir la description, la main-d'œuvre et les matériaux."); return; }
            try {
                await apiFetch(`/requests/${q.requestId}/quotes`, {
                    method: "POST", body: {
                        description: q.description, mainOeuvre: parseFloat(q.mainOeuvre), materiaux: parseFloat(q.materiaux),
                        frais: parseFloat(q.frais || 0), dureeEstimee: q.dureeEstimee, dateProposee: q.dateProposee || undefined
                    }
                });
                setView("dashboard"); loadFeed();
            } catch (e) { alert(e.message); }
        }

        function setReviewScore(field, val) { state.reviewDraft[field] = val; render(); }
        async function submitReview(requestId) {
            const d = state.reviewDraft;
            if (!d.qualite || !d.ponctualite || !d.prix || !d.communication || !d.professionnalisme) {
                alert("Merci de noter les cinq critères."); return;
            }
            try {
                await apiFetch("/reviews", { method: "POST", body: { requestId, ...d } });
                state.reviewDraft = { qualite: 0, ponctualite: 0, prix: 0, communication: 0, professionnalisme: 0, commentaire: "", submitted: true };
                render();
            } catch (e) { alert(e.message); }
        }

        async function markNotificationRead(id) {
            try { await apiFetch(`/notifications/${id}/read`, { method: "PATCH" }); loadNotifications(); }
            catch (e) { /* silencieux */ }
        }

        async function suspendUser(id, suspended) {
            try { await apiFetch(`/admin/users/${id}/suspend`, { method: "PATCH", body: { suspended } }); loadAdmin(); }
            catch (e) { alert(e.message); }
        }
        async function verifyPro(id, verified) {
            try { await apiFetch(`/admin/professionals/${id}/verify`, { method: "PATCH", body: { verified } }); loadAdmin(); }
            catch (e) { alert(e.message); }
        }

        /* =========================================================================
           Assistant (Wizard) de publication de demande
           ========================================================================= */
        const WIZARD_TOTAL = 9;
        function wizardSet(field, val, extra) { state.wizardData[field] = val; if (extra) Object.assign(state.wizardData, extra); render(); }
        function wizardChoiceGroup(field, options, cols) {
            return `<div class="grid grid-cols-${cols} gap-3">
    ${options.map(o => `
      <button onclick="wizardSet('${field}','${o.replace(/'/g, "\\'")}')" class="text-sm font-medium text-left px-4 py-3.5 rounded-lg border transition-colors ${state.wizardData[field] === o ? 'border-orange-500 bg-orange-50 text-orange-700' : 'border-slate-200 text-slate-600 hover:border-slate-300'}">${o}</button>`).join("")}
  </div>`;
        }
        function wizardCanNext() {
            const d = state.wizardData, s = state.wizardStep;
            if (s === 1) return !!d.besoin;
            if (s === 2) return !!d.categoryId;
            if (s === 3) return d.description.trim().length > 9;
            if (s === 5) return !!d.ville;
            if (s === 6) return !!d.budget;
            if (s === 7) return !!d.urgence;
            return true;
        }
        function wizardNext() { if (wizardCanNext()) state.wizardStep = Math.min(state.wizardStep + 1, WIZARD_TOTAL); render(); }
        function wizardPrev() { state.wizardStep = Math.max(state.wizardStep - 1, 1); render(); }
        function wizardUpdateText(field, val) { state.wizardData[field] = val; }
        function wizardAddPhoto() { state.wizardData.photos++; render(); }

        async function publierDemande() {
            if (!requireLogin("particulier")) { alert("Connectez-vous en tant que particulier pour publier une demande."); setView("login"); return; }
            const d = state.wizardData;
            state.wizardSubmitting = true; state.wizardError = ""; render();
            try {
                await apiFetch("/requests", {
                    method: "POST", body: {
                        typeBesoin: d.besoin, categoryId: d.categoryId, description: d.description,
                        ville: d.ville, codePostal: d.codePostal, budget: d.budget, urgence: d.urgence,
                        disponibilite: d.disponibilite, photoUrls: []
                    }
                });
                state.wizardStep = 1;
                state.wizardData = { besoin: "", categoryId: null, categoryName: "", description: "", photos: 0, ville: "", codePostal: "", budget: "", urgence: "", disponibilite: "" };
                state.wizardSubmitting = false;
                goToDashboard();
            } catch (e) {
                state.wizardError = e.message; state.wizardSubmitting = false; render();
            }
        }

        /* =========================================================================
           Header
           ========================================================================= */
        function renderHeader() {
            const navItem = (label, target) => `
    <button onclick="setView('${target}')" class="text-sm font-medium transition-colors ${state.view === target ? 'text-blue-950' : 'text-slate-500 hover:text-blue-950'}">${label}</button>`;
            const unread = state.notifications.filter(n => !n.is_read).length;
            return `
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">
      <button onclick="setView('home')" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center">${icon('wrench', 'w-5 h-5 text-white')}</div>
        <div class="leading-tight text-left">
          <div class="text-lg font-extrabold tracking-tight text-blue-950 font-display">BRICOLE</div>
          <div class="text-[11px] text-slate-500" dir="rtl">بريكولي</div>
        </div>
      </button>
      <nav class="hidden md:flex items-center gap-7">
        ${navItem("Accueil", "home")}
        ${navItem("Comment ça marche", "comment")}
        ${navItem("Recherche pro", "search")}
        ${state.user ? navItem("Mon espace", "dashboard") : ""}
      </nav>
      <div class="hidden md:flex items-center gap-3">
        ${state.user ? `
          <button onclick="setView('notifications');loadNotifications()" class="relative p-2 rounded-lg hover:bg-slate-100">
            ${icon('bell', 'w-5 h-5 text-blue-950')}
            ${unread > 0 ? `<span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-orange-500"></span>` : ""}
          </button>
          <button onclick="setView('settings')" class="text-sm font-semibold px-4 py-2 rounded-lg text-blue-950 hover:bg-slate-100 transition-colors">${state.user.full_name || state.user.fullName}</button>
        ` : `
          <button onclick="setView('login')" class="text-sm font-semibold px-4 py-2 rounded-lg text-blue-950 hover:bg-slate-100 transition-colors">Connexion</button>
        `}
        <button onclick="setView('wizard')" class="text-sm font-semibold px-4 py-2.5 rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition-colors shadow-sm">Décrire mon besoin</button>
      </div>
      <button class="md:hidden text-blue-950" onclick="toggleMenu()">${icon(state.menuOpen ? 'x' : 'menu', 'w-6 h-6')}</button>
    </div>
    ${state.menuOpen ? `
    <div class="md:hidden border-t border-slate-100 px-5 py-4 flex flex-col gap-4 bg-white">
      ${navItem("Accueil", "home")}
      ${navItem("Comment ça marche", "comment")}
      ${navItem("Recherche pro", "search")}
      ${state.user ? navItem("Mon espace", "dashboard") + navItem("Notifications", "notifications") + navItem("Paramètres", "settings") : navItem("Connexion", "login")}
      <button onclick="setView('wizard');toggleMenu()" class="text-sm font-semibold px-4 py-2.5 rounded-lg bg-orange-500 text-white text-center">Décrire mon besoin</button>
    </div>` : ""}
  </header>`;
        }

        /* =========================================================================
           Accueil
           ========================================================================= */
        function renderHome() {
            return `
  <section class="bg-blue-950">
    <div class="max-w-6xl mx-auto px-5 md:px-8 py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center">
      <div>
        <h1 class="text-3xl md:text-5xl font-extrabold text-white leading-tight font-display">Un problème chez vous ?<br/>Trouvez le bon professionnel.</h1>
        <p class="mt-5 text-blue-100 text-base md:text-lg max-w-md">Décrivez votre besoin, ajoutez quelques photos et recevez l'aide de professionnels qualifiés près de chez vous.</p>
        <div class="mt-8 flex flex-col sm:flex-row gap-3">
          <button onclick="setView('wizard')" class="px-6 py-3.5 rounded-lg bg-orange-500 text-white font-semibold hover:bg-orange-600 transition-colors flex items-center justify-center gap-2">
            J'ai besoin d'un professionnel ${icon('arrow-right', 'w-4 h-4')}
          </button>
          <button onclick="state.authType='pro'; setView(state.user ? 'dashboard' : 'signup')" class="px-6 py-3.5 rounded-lg bg-blue-900 text-white font-semibold hover:bg-blue-800 transition-colors border border-blue-800">Je suis un professionnel</button>
        </div>
        <div class="mt-8 flex items-center gap-6 text-blue-200 text-sm">
          <div class="flex items-center gap-1.5">${icon('shield-check', 'w-4 h-4')} Profils vérifiés</div>
          <div class="flex items-center gap-1.5">${icon('users', 'w-4 h-4')} Communauté grandissante</div>
        </div>
      </div>
      <div class="rounded-2xl bg-blue-900 border border-blue-800 p-6">
        <div class="rounded-xl bg-white p-5">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 font-semibold">KB</div>
            <div>
              <div class="font-semibold text-blue-950 text-sm">Karim B. — Plombier</div>
              <div class="flex items-center gap-1 text-xs text-slate-500">${stars(4.9)} 132 avis · Blida</div>
            </div>
            ${icon('badge-check', 'w-5 h-5 text-blue-600 ml-auto')}
          </div>
          <div class="text-sm text-slate-600 bg-slate-50 rounded-lg p-3 mb-3">"Je peux passer aujourd'hui entre 14h et 16h pour un diagnostic de la fuite."</div>
          <div class="flex gap-2"><div class="flex-1 h-8 rounded-md bg-blue-50"></div><div class="flex-1 h-8 rounded-md bg-blue-50"></div></div>
        </div>
      </div>
    </div>
  </section>

  <section class="max-w-6xl mx-auto px-5 md:px-8 py-16 md:py-20">

        function renderFAQ() {
            const qas = [
                ["Combien coûte l'utilisation de BRICOLE ?", "La publication d'une demande et la mise en relation sont gratuites pour les particuliers. Les professionnels souscrivent à un abonnement pour recevoir des demandes."],
                ["Comment sont vérifiés les professionnels ?", "Chaque professionnel fournit ses documents d'activité, qui sont contrôlés avant l'obtention du badge « Vérifié »."],
                ["Puis-je annuler une demande ?", "Oui, à tout moment depuis votre tableau de bord, tant qu'aucun professionnel n'a été sélectionné."],
                ["Comment mes coordonnées sont-elles protégées ?", "Votre adresse exacte n'est jamais visible publiquement ; seule une zone approximative est communiquée avant l'acceptation d'un devis."]
            ];
            return `
  <div class="max-w-2xl mx-auto px-5 md:px-8 py-16">
    <h1 class="text-3xl font-extrabold text-blue-950 text-center font-display">Questions fréquentes</h1>
    <div class="mt-10 space-y-3">
      ${qas.map(([q, a]) => `
        <details class="bg-white rounded-xl border border-slate-100 p-5 group">
          <summary class="text-sm font-semibold text-blue-950 cursor-pointer list-none flex justify-between items-center">${q}${icon('chevron-right', 'w-4 h-4 text-slate-400 group-open:rotate-90 transition-transform')}</summary>
          <p class="text-sm text-slate-500 mt-3">${a}</p>
        </details>`).join("")}
    </div>
  </div>`;
        }
        function renderLegal(title, paragraphs) {
            return `
  <div class="max-w-2xl mx-auto px-5 md:px-8 py-16">
    <h1 class="text-2xl font-extrabold text-blue-950 font-display">${title}</h1>
    <div class="mt-6 space-y-4 text-sm text-slate-600 leading-relaxed">${paragraphs.map(p => `<p>${p}</p>`).join("")}</div>
  </div>`;
        }
        function renderCGU() {
            return renderLegal("Conditions générales d'utilisation", [
                "L'utilisation de BRICOLE implique l'acceptation pleine et entière des présentes conditions générales.",
                "BRICOLE agit en tant qu'intermédiaire de mise en relation et n'est pas partie aux contrats conclus entre particuliers et professionnels.",
                "Chaque utilisateur s'engage à fournir des informations exactes et à respecter les autres membres de la plateforme.",
            ]);
        }
        function renderConfidentialite() {
            return renderLegal("Politique de confidentialité", [
                "BRICOLE collecte uniquement les données nécessaires à la mise en relation entre particuliers et professionnels.",
                "Les coordonnées exactes d'un particulier ne sont jamais partagées publiquement.",
                "Vous pouvez à tout moment demander l'accès, la rectification ou la suppression de vos données personnelles.",
            ]);
        }
        function renderContact() {
            return `
  <div class="max-w-md mx-auto px-5 md:px-8 py-16">
    <h1 class="text-2xl font-extrabold text-blue-950 font-display">Contact</h1>
    <div class="mt-6 space-y-3">
      <input placeholder="Nom" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm">
      <input placeholder="Email" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm">
      <textarea rows="4" placeholder="Votre message" class="w-full rounded-lg border border-slate-200 p-3 text-sm"></textarea>
      <button onclick="alert('Merci, votre message a été noté. (Formulaire de démonstration — non connecté à un service d\\'envoi.)')" class="w-full py-3 rounded-lg bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600">Envoyer</button>
    </div>
  </div>`;
        }

        /* =========================================================================
           Footer
           ========================================================================= */
        function renderFooter() {
            return `
  <footer class="bg-blue-950 text-blue-200 text-sm">
    <div class="max-w-6xl mx-auto px-5 md:px-8 py-10 flex flex-col sm:flex-row justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-orange-500 flex items-center justify-center">${icon('wrench', 'w-5 h-5 text-white')}</div>
        <div class="leading-tight"><div class="text-lg font-extrabold tracking-tight text-white font-display">BRICOLE</div><div class="text-[11px] text-blue-200" dir="rtl">بريكولي</div></div>
      </div>
      <div class="flex flex-wrap gap-x-6 gap-y-2">
        <button onclick="setView('comment')" class="hover:text-white">À propos</button>
        <button onclick="setView('faq')" class="hover:text-white">FAQ</button>
        <button onclick="setView('cgu')" class="hover:text-white">Conditions générales</button>
        <button onclick="setView('confidentialite')" class="hover:text-white">Confidentialité</button>
        <button onclick="setView('contact')" class="hover:text-white">Contact</button>
      </div>
    </div>
    <div class="border-t border-blue-900 py-4 text-center text-xs text-blue-400">© 2026 BRICOLE / بريكولي — Tous droits réservés</div>
  </footer>`;
        }

        /* =========================================================================
           Routeur / rendu principal
           ========================================================================= */
        function render() {
            if (!state.sessionChecked) {
                document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center">${spinner()}</div>`;
                return;
            }
            const views = {
                home: renderHome, comment: renderComment, wizard: renderWizard,
                search: renderSearch, profile: renderProfile, requestDetail: renderRequestDetail,
                quoteForm: renderQuoteForm, messaging: renderMessaging,
                dashboard: renderDashboard, login: renderLogin, signup: renderSignup,
                appointments: renderAppointments, notifications: renderNotifications,
                reviews: renderReviews, settings: renderSettings, admin: renderAdmin,
                faq: renderFAQ, cgu: renderCGU, confidentialite: renderConfidentialite, contact: renderContact
            };
            document.getElementById("app").innerHTML = `
    ${renderHeader()}
    ${(views[state.view] || renderHome)()}
    ${renderFooter()}
  `;
            if (window.lucide) lucide.createIcons();
        }

        init();
    </script>
</body>

</html>
