/* =========================================================================
   Client API
   ========================================================================= */
async function apiFetch(path, { method = "GET", body, auth = true } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && state.token) headers.Authorization = `Bearer ${state.token}`;

  let response;
  try {
    response = await fetch(`${API_BASE}${path}`, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    throw new Error("Impossible de joindre le serveur. Vérifiez votre connexion ou l'URL du backend (API_BASE).");
  }

  let data = {};
  try { data = await response.json(); } catch (_) { /* réponse vide (ex: 204) */ }

  if (!response.ok) {
    throw new Error(data.error || `Erreur ${response.status}`);
  }
  return data;
}

/* =========================================================================

   ========================================================================= */
async function init(){
  const lang = state.lang || "fr";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  try {
    const { categories } = await apiFetch("/categories", { auth:false });
    state.categories = categories;
  } catch(e) { state.errors.categories = e.message; }

  if (state.token) {
    try {
      const { user } = await apiFetch("/auth/me");
      state.user = user;
    } catch(e) {
      clearSession(); // token invalide/expiré
    }
  }
  state.sessionChecked = true;
  render();
}

   ========================================================================= */
function setAuthType(t){ state.authType = t; state.authError = ""; render(); }

async function doLogin(email, password){
  state.authError = ""; state.authLoading = true; render();
  try {
    const { token, user } = await apiFetch("/auth/login", { method:"POST", auth:false, body:{ email, password } });
    saveSession(token, user);
    state.authLoading = false;
    goToDashboard();
  } catch(e){
    state.authError = e.message; state.authLoading = false; render();
  }
}

async function doRegister(fields){
  state.authError = ""; state.authLoading = true; render();
  try {
    const { token, user } = await apiFetch("/auth/register", { method:"POST", auth:false, body:{
      fullName: fields.fullName, email: fields.email, password: fields.password,
      role: state.authType, phone: fields.phone
    }});
    saveSession(token, user);
    state.authLoading = false;
    goToDashboard();
  } catch(e){
    state.authError = e.message; state.authLoading = false; render();
  }
}

function logout(){ clearSession(); setView("home"); }

function goToDashboard(){
  setView("dashboard");
  if (state.user.role === "particulier") loadMyRequests();
  else if (state.user.role === "pro") loadFeed();
  loadNotifications();
}

function requireLogin(role){
  if (!state.user) { setView("login"); return false; }
  if (role && state.user.role !== role) { setView("dashboard"); return false; }
  return true;
}

async function loadMessages(conversationId){
  state.selectedConversationId = conversationId;
  state.loading.messages = true; render();
  try {
    const res = await apiFetch(`/conversations/${conversationId}/messages`);
    state.messages = res.messages || [];
    let conv = state.conversations.find(c => c.id === conversationId);
    if (!conv) {
      try {
        const convRes = await apiFetch(`/conversations/${conversationId}`);
        if (convRes && convRes.conversation) {
          state.conversations.push(convRes.conversation);
        }
      } catch(_) {}
    }
  }
  catch(e){ state.errors.messages = e.message; }
  state.loading.messages = false; render();
  setTimeout(() => {
    const box = document.getElementById("msgBox");
    if (box) box.scrollTop = box.scrollHeight;
  }, 50);
}

/* =========================================================================
   Assistant (Wizard) de publication de demande
   ========================================================================= */
const WIZARD_TOTAL = 9;
function wizardSet(field, val, extra){ state.wizardData[field] = val; if(extra) Object.assign(state.wizardData, extra); render(); }
function wizardChoiceGroup(field, options, cols){
  return `<div class="grid grid-cols-${cols} gap-3">
    ${options.map(o=>`
      <button onclick="wizardSet('${field}','${o.replace(/'/g,"\\'")}')" class="text-sm font-medium text-left px-4 py-3.5 rounded-lg border transition-colors ${state.wizardData[field]===o?'border-orange-500 bg-orange-50 text-orange-700':'border-slate-200 text-slate-600 hover:border-slate-300'}">${o}</button>`).join("")}
  </div>`;
}
function wizardCanNext(){
  const d = state.wizardData, s = state.wizardStep;
  if(s===1) return !!d.besoin;
  if(s===2) return !!d.categoryId;
  if(s===3) return d.description.trim().length > 9;
  if(s===5) return !!d.ville;
  if(s===6) return !!d.budget;
  if(s===7) return !!d.urgence;
  return true;
}
function wizardNext(){ if(wizardCanNext()) state.wizardStep = Math.min(state.wizardStep+1, WIZARD_TOTAL); render(); }
function wizardPrev(){ state.wizardStep = Math.max(state.wizardStep-1, 1); render(); }
function wizardUpdateText(field, val){ state.wizardData[field] = val; }
function wizardAddPhoto(){ state.wizardData.photos++; render(); }

async function publierDemande(){
  if (!requireLogin("particulier")) { alert("Connectez-vous en tant que particulier pour publier une demande."); setView("login"); return; }
  const d = state.wizardData;
  state.wizardSubmitting = true; state.wizardError = ""; render();
  try {
    await apiFetch("/requests", { method:"POST", body:{
      typeBesoin: d.besoin, categoryId: d.categoryId, description: d.description,
      ville: d.ville, codePostal: d.codePostal, budget: d.budget, urgence: d.urgence,
      disponibilite: d.disponibilite, photoUrls: []
    }});
    state.wizardStep = 1;
    state.wizardData = {besoin:"",categoryId:null,categoryName:"",description:"",photos:0,ville:"",codePostal:"",budget:"",urgence:"",disponibilite:""};
    state.wizardSubmitting = false;
    goToDashboard();
  } catch(e){
    state.wizardError = e.message; state.wizardSubmitting = false; render();
  }
}

  if(s===3) body = `<h2 class="text-xl font-bold text-blue-950 mb-2 font-display">${wq.q3}</h2>
    <p class="text-sm text-slate-500 mb-4">${wq.q3Sub}</p>

  if(s===4) body = `<h2 class="text-xl font-bold text-blue-950 mb-5 font-display">${wq.q4}</h2>
    <button onclick="wizardAddPhoto()" class="w-full rounded-lg border-2 border-dashed border-slate-300 py-10 flex flex-col items-center gap-2 text-slate-400 hover:border-orange-300 hover:text-orange-500 transition-colors">
      ${icon('image-plus','w-7 h-7')}<span class="text-sm font-medium">${wq.q4Btn}</span>
    </button>
    <p class="text-xs text-slate-400 mt-2">${wq.q4Sub}</p>
    ${d.photos>0 ? `<div class="mt-4 flex gap-2 flex-wrap">${Array.from({length:d.photos}).map(()=>`<div class="w-16 h-16 rounded-lg bg-slate-100 flex items-center justify-center">${icon('camera','w-5 h-5 text-slate-400')}</div>`).join("")}</div>` : ""}`;
  if(s===5) body = `<h2 class="text-xl font-bold text-blue-950 mb-5 font-display">${wq.q5}</h2>
    <div class="space-y-3">
      <input oninput="wizardUpdateText('ville', this.value)" value="${d.ville}" placeholder="${wq.q5City}" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-200">
      <input oninput="wizardUpdateText('codePostal', this.value)" value="${d.codePostal}" placeholder="${wq.q5Zip}" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-200">
    </div>`;
  if(s===6) body = `<h2 class="text-xl font-bold text-blue-950 mb-5 font-display">${wq.q6}</h2>${wizardChoiceGroup('budget', choices.budgets, 2)}`;
  if(s===7) body = `<h2 class="text-xl font-bold text-blue-950 mb-5 font-display">${wq.q7}</h2>${wizardChoiceGroup('urgence', choices.urgences, 2)}`;
  if(s===8) body = `<h2 class="text-xl font-bold text-blue-950 mb-2 font-display">${wq.q8}</h2>
    <p class="text-sm text-slate-500 mb-4">${wq.q8Sub}</p>
    <input oninput="wizardUpdateText('disponibilite', this.value)" value="${d.disponibilite}" placeholder="${wq.q8Ph}" class="w-full rounded-lg border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-200">`;
  if(s===9){
    const rowLabels = wq.rows;
    const rows = [
      [rowLabels[0], d.besoin||"—"], [rowLabels[1], d.categoryName||"—"], [rowLabels[2], d.description||"—"],
      [rowLabels[3], `${d.photos} ${state.lang==='ar'?'ملف/صورة':'file(s)'}`], [rowLabels[4], `${d.ville||"—"} ${d.codePostal}`],
      [rowLabels[5], d.budget||"—"], [rowLabels[6], d.urgence||"—"], [rowLabels[7], d.disponibilite||"—"]
    ];
    body = `<h2 class="text-xl font-bold text-blue-950 mb-5 font-display">${wq.q9}</h2>
    ${!state.user ? `<div class="mb-4">${errorBox(wq.q9AuthWarning)}</div>` : ""}
    ${state.wizardError ? `<div class="mb-4">${errorBox(state.wizardError)}</div>` : ""}
    <div class="space-y-3 text-sm">
      ${rows.map(([l,v])=>`<div class="flex justify-between border-b border-slate-100 pb-2.5"><span class="text-slate-400">${l}</span><span class="text-slate-700 font-medium text-right max-w-[60%]">${v}</span></div>`).join("")}
    </div>`;
  }

  return `
  <div class="bg-slate-50 min-h-[70vh]">
    <div class="max-w-2xl mx-auto px-5 py-10">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-medium text-blue-950">${t("step")} ${s} / ${WIZARD_TOTAL}</span>
        <button onclick="setView('home')" class="text-sm text-slate-400 hover:text-slate-600">${t("cancel")}</button>
      </div>
      <div class="w-full h-1.5 bg-slate-200 rounded-full mb-8 overflow-hidden">
        <div class="h-full bg-orange-500 step-progress" style="width:${(s/WIZARD_TOTAL)*100}%"></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 md:p-8">
        ${body}
        <div class="flex items-center justify-between mt-8 pt-5 border-t border-slate-100">
          <button onclick="wizardPrev()" ${s===1?'disabled':''} class="flex items-center gap-1.5 text-sm font-medium px-4 py-2.5 rounded-lg ${s===1?'text-slate-300':'text-slate-500 hover:bg-slate-50'}">${icon(prevIcon,'w-4 h-4')} ${t("back")}</button>
          ${s<WIZARD_TOTAL
            ? `<button onclick="wizardNext()" class="flex items-center gap-1.5 text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors ${wizardCanNext()?'bg-blue-950 text-white hover:bg-blue-900':'bg-slate-100 text-slate-400'}">${t("continue")} ${icon(nextIcon,'w-4 h-4')}</button>`
            : `<button ${state.wizardSubmitting?'disabled':''} onclick="publierDemande()" class="flex items-center gap-1.5 text-sm font-semibold px-5 py-2.5 rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition-colors disabled:opacity-50">${state.wizardSubmitting?icon('loader-2','w-4 h-4 spin'):''} ${t("publish_request")} ${icon('check','w-4 h-4')}</button>`}
        </div>
      </div>
    </div>
  </div>`;
}

  return `
  <div class="bg-slate-50 min-h-[70vh]">
    <div class="max-w-2xl mx-auto px-5 md:px-8 py-10">
      <button onclick="setView('dashboard')" class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-950 mb-6">${icon('chevron-left','w-4 h-4')} ${t("back_to_requests", "Retour à mes demandes")}</button>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-5">

        <div class="text-xs text-slate-400 mt-3">${request.ville} · ${t("urgency_label")} : ${request.urgence} · ${t("budget_label")} : ${request.budget||t("not_specified")}</div>
        ${request.status === "pro_selectionne" || request.status === "en_cours" ? `
          <button onclick="markRequestComplete('${request.id}')" class="mt-4 text-sm font-medium px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700">${t("mark_completed", "Marquer les travaux comme terminés")}</button>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 mb-5">
        <div class="text-sm font-semibold text-blue-950 mb-3">${t("interested_pros", "Professionnels intéressés")} (${state.requestProposals.length})</div>
        ${state.requestProposals.length === 0 ? `<div class="text-sm text-slate-400">${t("no_interested_yet", "Aucun professionnel ne s'est encore manifesté.")}</div>` : `
        <div class="space-y-3">
          ${state.requestProposals.map(p=>`
            <div class="flex items-center justify-between border border-slate-100 rounded-lg p-4">
              <div>
                <div class="text-sm font-medium text-blue-950 flex items-center gap-1.5">${p.professional_name}${p.verified?icon('badge-check','w-3.5 h-3.5 text-blue-600'):''}</div>
                <div class="text-xs text-slate-400 mt-1">${p.message||""}</div>
              </div>
              <button onclick="openConversationForProposal('${request.id}','${p.professional_id}')" class="text-sm font-medium px-3 py-2 rounded-lg border border-slate-200 text-blue-950 hover:bg-slate-50">${t("message_btn", "Message")}</button>
            </div>`).join("")}
        </div>`}
      </div>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
        <div class="text-sm font-semibold text-blue-950 mb-3">${t("received_quotes", "Devis reçus")} (${state.requestQuotes.length})</div>
        ${state.requestQuotes.length === 0 ? `<div class="text-sm text-slate-400">${t("no_quotes_yet", "Aucun devis pour l'instant.")}</div>` : `
        <div class="space-y-4">
          ${state.requestQuotes.map(q=>`
            <div class="border border-slate-100 rounded-lg p-4">
              <div class="flex items-center justify-between">
                <span class="text-sm font-semibold text-blue-950">${q.professional_name}</span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${q.status==='accepte'?'bg-green-100 text-green-700':q.status==='refuse'?'bg-red-100 text-red-700':'bg-purple-100 text-purple-700'}">${q.status}</span>
              </div>
              <p class="text-sm text-slate-600 mt-2">${q.description}</p>
              <div class="flex justify-between items-center mt-3">
                <span class="text-xs text-slate-400">${t("estimated_duration", "Durée estimée")} : ${q.duree_estimee||"—"}</span>
                <span class="text-base font-bold text-blue-950 font-display">${Number(q.total).toLocaleString('fr-FR')} DA</span>
              </div>
              ${q.status==='en_attente' ? `

                <button onclick="decideQuote('${q.id}','refuse')" class="flex-1 text-sm font-medium px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">${t("refuse", "Refuser")}</button>

              </div>` : ""}
            </div>`).join("")}
        </div>`}
      </div>
    </div>
  </div>`;
}

function renderMessaging(){
  const isAr = state.lang === 'ar';
  const backIcon = isAr ? 'chevron-right' : 'chevron-left';
  const sendIcon = isAr ? 'send' : 'send';

  if (!state.selectedConversationId) {
    if (!state.conversationsLoaded && !state.loading.conversations) {
      loadConversations();
    }
    return `
    <div class="bg-slate-50 min-h-[70vh]">
      <div class="max-w-2xl mx-auto px-5 md:px-8 py-10">
        <h1 class="text-2xl font-extrabold text-blue-950 font-display">${t("my_conversations")}</h1>
        ${state.loading.conversations ? spinner() : state.errors.conversations ? `<div class="mt-6">${errorBox(state.errors.conversations)}</div>` : `
        <div class="mt-6 space-y-3">
          ${state.conversations.length===0 ? `<div class="bg-white rounded-xl border border-slate-100 p-8 text-center text-sm text-slate-400">${t("no_conversations")}</div>` : state.conversations.map(c=>`
            <button onclick="loadMessages('${c.id}')" class="w-full text-start bg-white rounded-xl border border-slate-100 p-5 hover:bg-slate-50 flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-semibold">${initialsOf(c.other_party_name)}</div>
              <div class="flex-1">
                <div class="text-sm font-semibold text-blue-950">${c.other_party_name}</div>
                <div class="text-xs text-slate-400 mt-0.5">${c.last_message || c.type_besoin}</div>
              </div>
            </button>`).join("")}
        </div>`}
      </div>
    </div>`;
  }

  const conv = state.conversations.find(c=>c.id===state.selectedConversationId);
  return `
  <div class="bg-slate-50 min-h-[70vh]">
    <div class="max-w-2xl mx-auto px-5 md:px-8 py-10">
      <button onclick="state.selectedConversationId=null;render()" class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-blue-950 mb-4">${icon(backIcon,'w-4 h-4')} ${t("all_conversations")}</button>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-100">
          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-900 flex items-center justify-center font-semibold">${initialsOf(conv ? conv.other_party_name : "?")}</div>
          <div><div class="text-sm font-semibold text-blue-950">${conv ? conv.other_party_name : ""}</div></div>
        </div>
        <div id="msgBox" class="p-5 space-y-3 h-80 overflow-y-auto">
          ${state.loading.messages ? spinner() : state.messages.map(m=>`

/* =========================================================================
   Paramètres
   ========================================================================= */
function saveBasicProfile(){
  apiFetch('/users/me',{method:'PUT',body:{fullName:document.getElementById('setName').value}})
    .then(r=>{state.user.full_name=r.user.full_name;render();})
    .catch(e=>alert(e.message));
}

function saveProProfile(){
  const ville = document.getElementById('setVille').value;
  const bio = document.getElementById('setBio').value;
  const experienceYears = document.getElementById('setExp').value;
  const metiers = Array.from(document.querySelectorAll('.setMetier:checked')).map(el=>el.value);
  apiFetch('/users/me',{method:'PUT',body:{
    ville, bio,
    experienceYears: experienceYears ? Number(experienceYears) : undefined,
    metiers
  }})
    .then(()=>{
      state.user.ville = ville;
      state.user.bio = bio;
      state.user.experience_years = experienceYears ? Number(experienceYears) : null;
      state.user.metiers = metiers;
      alert(t("saved_ok", "Profil mis à jour."));
      render();
    })
    .catch(e=>alert(e.message));
}

function renderSettings(){
  if (!state.user) { setView("login"); return ""; }
  const isPro = state.user.role === 'pro';
  const currentMetiers = state.user.metiers || [];

  <div class="bg-slate-50 min-h-[70vh]">
    <div class="max-w-xl mx-auto px-5 md:px-8 py-10">
      <h1 class="text-2xl font-extrabold text-blue-950 font-display">${t("settings", "Paramètres")}</h1>

        <div><label class="text-xs text-slate-400">${t("name_label", "Nom complet")}</label><input id="setName" value="${state.user.full_name||state.user.fullName||''}" class="w-full mt-1 rounded-lg border border-slate-200 px-4 py-2.5 text-sm"></div>
        <div><label class="text-xs text-slate-400">${t("email", "Email")}</label><input value="${state.user.email}" disabled class="w-full mt-1 rounded-lg border border-slate-200 px-4 py-2.5 text-sm bg-slate-50 text-slate-400"></div>

        <div><label class="text-xs text-slate-400">${t("city", "Ville")}</label><input id="setVille" value="${state.user.ville||''}" placeholder="${t('city_placeholder','Ex: Alger')}" class="w-full mt-1 rounded-lg border border-slate-200 px-4 py-2.5 text-sm"></div>
        <div><label class="text-xs text-slate-400">${t("experience_years", "Années d'expérience")}</label><input id="setExp" type="number" min="0" value="${state.user.experience_years||''}" class="w-full mt-1 rounded-lg border border-slate-200 px-4 py-2.5 text-sm"></div>
        <div><label class="text-xs text-slate-400">${t("bio", "Bio")}</label><textarea id="setBio" rows="3" class="w-full mt-1 rounded-lg border border-slate-200 px-4 py-2.5 text-sm">${state.user.bio||''}</textarea></div>

            ${state.categories.map(c=>`

        ${state.user.role === 'admin' ? `<button onclick="setView('admin');loadAdmin()" class="w-full py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-blue-950 hover:bg-slate-50">${t("admin", "Administration")}</button>` : ""}

      </div>

/* =========================================================================
   Administration

function renderAdmin(){
  if (state.loading.admin) return `<div class="bg-slate-50 min-h-[70vh]">${spinner()}</div>`;
  if (state.errors.admin) return `<div class="bg-slate-50 min-h-[70vh] max-w-2xl mx-auto px-5 py-10">${errorBox(state.errors.admin)}</div>`;
  if (!state.adminStats) return `<div class="bg-slate-50 min-h-[70vh]"></div>`;
  const s = state.adminStats;
  const labels = ADMIN_LABELS_I18N[state.lang] || ADMIN_LABELS_I18N.fr;
  const stats = [[labels[0],s.particuliers],[labels[1],s.professionnels],[labels[2],s.demandesPubliees],[labels[3],s.demandesTerminees],[labels[4],s.chiffreAffaires],[labels[5],s.nombreDevis]];
  return `
  <div class="bg-slate-50 min-h-[70vh]">
    <div class="max-w-5xl mx-auto px-5 md:px-8 py-10">
      <h1 class="text-2xl font-extrabold text-blue-950 font-display">${t("admin", "Administration")}</h1>
      <div class="mt-6 grid sm:grid-cols-3 gap-4">
        ${stats.map(([l,v])=>`<div class="bg-white rounded-xl border border-slate-100 p-5"><div class="text-2xl font-extrabold text-blue-950 font-display">${v}</div><div class="text-sm text-slate-500 mt-1">${l}</div></div>`).join("")}
      </div>
      <div class="mt-8 bg-white rounded-xl border border-slate-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 text-sm font-semibold text-blue-950">${t("recent_users", "Utilisateurs récents")}</div>
        <div class="divide-y divide-slate-100">
          ${state.adminUsers.map(u=>`
            <div class="px-5 py-4 flex items-center justify-between">
              <div><div class="text-sm font-medium text-blue-950">${u.full_name}</div><div class="text-xs text-slate-400">${u.role}${u.role==='pro' ? (u.verified? ' · ' + t("verified_adj") : ' · ' + t("not_verified_adj")) : ''}</div></div>
              <div class="flex items-center gap-3">
                ${u.role==='pro' && !u.verified ? `<button onclick="verifyPro('${u.id}',true)" class="text-xs font-medium text-blue-700 hover:underline">${t("verify_btn", "Vérifier")}</button>` : ""}

function renderFooter(){

/* =========================================================================
   Routeur / rendu principal
   ========================================================================= */
function render(){
  if (!state.sessionChecked) {
    document.getElementById("app").innerHTML = `<div class="min-h-screen flex items-center justify-center">${spinner()}</div>`;
    return;
  }
  const views = {
    home: renderHome, comment: renderComment, wizard: renderWizard,
    search: renderSearch, profile: renderProfile, requestDetail: renderRequestDetail,
    quoteForm: renderQuoteForm, messaging: renderMessaging,
    dashboard: renderDashboard, login: renderLogin, signup: renderSignup,
    appointments: renderAppointments, notifications: renderNotifications,
    reviews: renderReviews, settings: renderSettings, admin: renderAdmin,
    faq: renderFAQ, cgu: renderCGU, confidentialite: renderConfidentialite, contact: renderContact
  };
  document.getElementById("app").innerHTML = `
    ${renderHeader()}
    ${(views[state.view] || renderHome)()}
    ${renderFooter()}
  `;
  if (window.lucide) lucide.createIcons();
}

init();
</script>
